{% extends "base.html" %}


{% block content %}

<div class = "hero">

    <p class = "tagline">Track your watchlist, portfolio, and price alerts — all in one place with no ads.</p>

    <div class = "hero-actions">
        <a href="{% url 'login' %}" class="btn-primary">Log In</a>

{% endblock %}
